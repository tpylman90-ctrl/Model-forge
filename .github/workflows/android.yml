name: Model Forge Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-forge-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.5.2
    timeout-minutes: 55
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Activate Docker-provided Godot Android templates and SDK settings
        shell: bash
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates" "$HOME/.config/godot"
          cp -a /root/.local/share/godot/export_templates/4.5.2.stable "$HOME/.local/share/godot/export_templates/"
          cp /root/.config/godot/editor_settings-4.5.tres "$HOME/.config/godot/editor_settings-4.5.tres"
          test -f "$HOME/.local/share/godot/export_templates/4.5.2.stable/android_debug.apk"
          test -f "$HOME/.config/godot/editor_settings-4.5.tres"
      - name: Verify engine and import project
        shell: bash
        run: |
          godot --version
          godot --headless --editor --path . --import --quit
      - name: Parse Godot editor GDScript before launching tests
        shell: bash
        run: godot --headless --path . --check-only --script res://scripts/main.gd
      - name: Run headless geometry smoke test
        shell: bash
        run: timeout --signal=SIGTERM --kill-after=5s 45s godot --headless --path . --script res://tests/smoke.gd
      - name: Validate soft shaping, symmetry and the touch toolbar
        shell: bash
        run: timeout --signal=SIGTERM --kill-after=5s 45s godot --headless --path . --script res://tests/tools_smoke.gd
      - name: Validate actual GUI tab click routing
        shell: bash
        run: timeout --signal=SIGTERM --kill-after=5s 45s godot --headless --path . --script res://tests/touch_gui_smoke.gd
      - name: Validate Open GLB and Save GLB native picker callbacks
        shell: bash
        run: timeout --signal=SIGTERM --kill-after=5s 45s godot --headless --path . --script res://tests/picker_smoke.gd
      - name: Check SAF plugin callbacks in GDScript
        shell: bash
        run: timeout --signal=SIGTERM --kill-after=5s 45s godot --headless --path . --script res://tests/saf_smoke.gd
      - name: Validate full editing workflow on demo GLB
        shell: bash
        run: timeout --signal=SIGTERM --kill-after=5s 45s godot --headless --path . --script res://tests/workflow_smoke.gd
      - name: Validate touch axes and automotive surface shaping
        shell: bash
        run: timeout --signal=SIGTERM --kill-after=5s 45s godot --headless --path . --script res://tests/gizmo_surface_smoke.gd
      - name: Install Godot 4.5 Android SDK platform and build tools
        shell: bash
        run: |
          yes | sdkmanager --sdk_root=/usr/lib/android-sdk --licenses >/dev/null || true
          sdkmanager --sdk_root=/usr/lib/android-sdk "platform-tools" "platforms;android-35" "build-tools;35.0.1"
      - name: Configure Gradle for Android plugin
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile native Android document bridge
        shell: bash
        run: |
          gradle -p android_plugin --no-daemon --stacktrace :plugin:assembleDebug
          mkdir -p addons/ModelForgeFiles/bin/debug
          cp android_plugin/plugin/build/outputs/aar/plugin-debug.aar addons/ModelForgeFiles/bin/debug/ModelForgeFiles-debug.aar
          test -s addons/ModelForgeFiles/bin/debug/ModelForgeFiles-debug.aar
          unzip -l addons/ModelForgeFiles/bin/debug/ModelForgeFiles-debug.aar | grep classes.jar
      - name: Prepare debug signing
        shell: bash
        run: |
          mkdir -p "$HOME/.android" build
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Model Forge,C=US"
          fi
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
      - name: Export APK
        shell: bash
        run: |
          godot --headless --path . --install-android-build-template --export-debug Android build/ModelForge-debug.apk
          test -s build/ModelForge-debug.apk
          ls -lh build/ModelForge-debug.apk
      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ModelForge-Android-APK
          path: build/ModelForge-debug.apk
          if-no-files-found: error
          retention-days: 21
          compression-level: 0
      - name: Audit native class after preserving APK
        shell: bash
        run: |
          unzip -Z1 build/ModelForge-debug.apk | grep -F '.dex'
          unzip -p build/ModelForge-debug.apk 'classes*.dex' > bridge-classes.dex
          if grep -a -F 'ModelForgeFiles' bridge-classes.dex > /dev/null; then
            echo "ModelForgeFiles class included in APK"
          else
            echo "ERROR: APK missing native ModelForgeFiles bridge"
            exit 1
          fi
